<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="theme-color" content="#0e1114">
<title>Solara Bay - Prototipo Godot</title>
<style>
html,body,#canvas{margin:0;padding:0;border:0}
body{color:#fff;background:#0e1114;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#canvas{display:block}#canvas:focus{outline:none}
#ld{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;
 background:radial-gradient(120% 80% at 70% 20%,#3a2050 0%,#15131f 55%,#0b0d12 100%);text-align:center}
#ld h1{margin:0;font-weight:300;letter-spacing:.32em;font-size:clamp(20px,6vw,40px);color:#ffd27a}
#ld h1 b{display:block;font-weight:600;letter-spacing:.18em;font-size:.55em;color:#5fd6cc;margin-top:6px}
#bar{width:min(80vw,460px);height:10px;border-radius:6px;background:#22303a;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.4)}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4fb8,#ffd23f,#29f0ff);transition:width .3s}
#pct{font:600 28px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums}
#stage{font-size:16px;color:#e9e3d6;min-height:1.4em}
#hint{font-size:13px;color:#a3a7b3;max-width:440px}
#go{display:none;margin-top:8px;padding:16px 34px;border-radius:999px;border:0;font:700 20px system-ui,sans-serif;color:#1a1205;background:linear-gradient(180deg,#ffd23f,#e0a400);box-shadow:0 6px 24px rgba(255,210,63,.35)}
#err{display:none;position:fixed;left:10px;right:10px;top:10px;z-index:20;max-height:45vh;overflow:auto;background:#3b1520;border:1px solid #ff5a7a;border-radius:12px;padding:12px 14px;font:13px/1.4 ui-monospace,Menlo,monospace;color:#ffe3e8;white-space:pre-wrap;word-break:break-word}
#err b{font-family:system-ui,sans-serif;font-size:15px;color:#fff}
#err button,#err a{margin:8px 8px 0 0;padding:8px 14px;border-radius:999px;border:1px solid #ff9db0;background:#5b2030;color:#fff;font:600 14px system-ui,sans-serif;text-decoration:none;display:inline-block}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="solara-030-step5.icon.png" />
<link rel="apple-touch-icon" href="solara-030-step5.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas">Seu navegador não suporta canvas.</canvas>
<noscript>Ative o JavaScript para jogar.</noscript>
<div id="ld">
  <h1>SOLARA BAY<b>MIAMI BEACH DRIVE</b></h1>
  <div id="pct">0%</div>
  <div id="bar"><i></i></div>
  <div id="stage">Preparando…</div>
  <div id="hint">Na primeira vez o jogo é baixado (cerca de 25 MB pela internet). Use Wi-Fi se puder.</div>
  <button id="go" type="button">▶ Toque para jogar</button>
</div>
<div id="err" role="alert"></div>
<script>
// ---------- painel de erros (para o jogador poder tirar print) ----------
(function () {
  const box = document.getElementById('err'); const seen = new Set(); let n = 0;
  const IGNORE = /glBlitFramebuffer|GL_INVALID|WebGL: too many|AudioContext was not allowed|The AudioContext/i;
  window.solaraShowError = function (title, msg, fatal) {
    msg = String(msg || '').slice(0, 1200); if (IGNORE.test(msg) || seen.has(msg) || n > 12) return; seen.add(msg); n++;
    if (!box.firstChild) {
      box.innerHTML = '<b>⚠️ Algo deu errado — tire um print desta tela</b>\n<span id="errinfo"></span>\n';
      const info = 'Aparelho: ' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, '') + '\nNúcleos: ' + (navigator.hardwareConcurrency || '?') + ' · Memória: ' + (navigator.deviceMemory || '?') + ' GB · Versão: 0.3.0-step5';
      box.querySelector('#errinfo').textContent = info;
      const r = document.createElement('a'); r.href = location.pathname + '?q=leve&r=' + Date.now(); r.textContent = '↻ Recarregar no modo leve';
      const x = document.createElement('button'); x.textContent = 'Fechar'; x.onclick = () => { box.style.display = 'none'; };
      box.append(r, x, document.createTextNode('\n'));
    }
    const p = document.createElement('div'); p.textContent = '• ' + title + ': ' + msg; box.appendChild(p);
    if (fatal || !window.__solaraReady) box.style.display = 'block';
  };
  window.addEventListener('error', (e) => solaraShowError('Erro', (e.message || e) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')));
  window.addEventListener('unhandledrejection', (e) => solaraShowError('Erro', e.reason && (e.reason.message || e.reason)));
}());
</script>
<script src="solara-030-step5.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"solara-030-step5","experimentalVK":false,"fileSizes":{"solara-030-step5.pck":15957280,"solara-030-step5.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
(function () {
  const ld = document.getElementById('ld'), bar = document.querySelector('#bar i'), pct = document.getElementById('pct'),
        stageEl = document.getElementById('stage'), hint = document.getElementById('hint'), go = document.getElementById('go'), canvas = document.getElementById('canvas');
  const t0 = performance.now(); let last = t0, cur = 0, ready = false;
  const T = () => ((performance.now() - t0) / 1000).toFixed(1) + ' s';
  function show(p, text) { cur = Math.max(cur, Math.min(100, Math.round(p))); bar.style.width = cur + '%'; pct.textContent = cur + '%'; if (text) stageEl.textContent = text; last = performance.now(); }
  // 0–60%: download · 60–70%: motor · 70–100%: montagem do mundo (etapas vindas do jogo)
  window.solaraStage = function (text, p) { console.log('[Solara] ' + T() + ' etapa: ' + text); show(70 + p * 0.3, text); };
  window.solaraReady = function () {
    ready = true; window.__solaraReady = true; console.log('[Solara] ' + T() + ' PRONTO');
    show(100, 'Pronto!'); hint.textContent = ''; go.style.display = 'block'; bar.parentNode.style.display = 'none';
    go.focus();
  };
  go.addEventListener('click', () => {
    ld.remove(); canvas.focus();
    const el = document.documentElement;
    if (matchMedia('(pointer:coarse)').matches && el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  });
  // celular lento: avisa em vez de parecer travado
  setInterval(() => {
    if (ready || !ld.isConnected) return;
    const idle = (performance.now() - last) / 1000;
    if (idle > 20) hint.textContent = 'Ainda trabalhando (' + Math.round(idle) + ' s nesta etapa)… celulares mais simples demoram mais na primeira vez. Não feche a página.';
  }, 2000);
  // WebGL 2 é obrigatório
  try {
    const gl = document.createElement('canvas').getContext('webgl2');
    if (!gl) { solaraShowError('WebGL 2', 'Este navegador/celular não liberou WebGL 2 (gráficos 3D). Atualize o Chrome, desligue a economia de bateria e tente de novo.', true); stageEl.textContent = 'Seu navegador não suporta os gráficos 3D do jogo.'; return; }
  } catch (e) {}
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); solaraShowError('Vídeo', 'O celular ficou sem memória de vídeo (WebGL perdido). Feche outros apps/abas e recarregue no modo leve.', true); }, false);
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length) { solaraShowError('Navegador', 'Faltam recursos: ' + missing.join(', '), true); return; }
  const engine = new Engine(GODOT_CONFIG); window.__godotEngine = engine;
  show(1, 'Baixando o jogo…');
  let dlDone = false;
  engine.startGame({
    onProgress: function (c, t) {
      if (c > 0 && t > 0) {
        const mb = (x) => (x / 1048576).toFixed(1);
        show(c / t * 60, 'Baixando o jogo…');
        if (c >= t && !dlDone) { dlDone = true; console.log('[Solara] ' + T() + ' download completo'); show(62, 'Iniciando o motor…'); }
      }
    },
    onPrint: function () { console.log.apply(console, arguments); },
    onPrintError: function () {
      const m = Array.prototype.join.call(arguments, ' '); console.error(m);
      if (/SCRIPT ERROR|ERROR:|Parse Error|crash|Aborted|out of memory/i.test(m) && !/resources still in use|glBlit/i.test(m)) solaraShowError('Jogo', m);
    },
    onExit: function (code) { if (code) solaraShowError('Jogo', 'O jogo fechou (código ' + code + ').', true); },
  }).then(() => {
    console.log('[Solara] ' + T() + ' motor iniciado');
    if (!ready) show(70, 'Montando a cidade…');
  }, (err) => {
    const m = (err && err.message) || String(err);
    solaraShowError('Ao iniciar', /memory|Memory|allocation|OOM/i.test(m) ? m + '\nO celular ficou sem memória. Feche outros apps e tente de novo.' : m, true);
    stageEl.textContent = 'Não foi possível iniciar o jogo.';
  });
}());
</script>
</body>
</html>
